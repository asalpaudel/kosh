spring.application.name=backend


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kosh}
spring.datasource.username=${DB_USERNAME:kosh_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME:kosh_app}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD:}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.superadmin.email=${SUPERADMIN_EMAIL:}
# BCrypt hash, never the plaintext. Unset means superadmin login is closed.
app.superadmin.password-hash=${SUPERADMIN_PASSWORD_HASH:}
app.superadmin.otp-enabled=${SUPERADMIN_OTP_ENABLED:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=${SESSION_IDLE_TIMEOUT:30m}

# Reject unexpectedly large requests before they can be materialised in memory or PostgreSQL.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:24MB}

# API errors must not expose implementation details, exception messages, or stack traces.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Comma-separated frontend origins allowed to call the API with cookies.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
