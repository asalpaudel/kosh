spring.flyway.locations=classpath:db/migration,classpath:db/devseed
spring.flyway.placeholders.seedPasswordHash=${SEED_PASSWORD_HASH:!SEED_ACCOUNT_LOCKED!}
app.auth.two-factor-enabled=false
# Sample superadmin for local development: superadmin@kosh.com / Super123
# The hash is committed on purpose so a fresh checkout can sign in. It is a known
# credential: production must override both values from the environment.
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@kosh.com}
app.superadmin.password-hash=${SUPERADMIN_PASSWORD_HASH:$2a$10$Kv2AHdPd6li/hBxlHtWhleD93yofc1M3O/rVgl/LfXh4PA6kbnX4W}

# Local development runs over plain HTTP, where a Secure cookie would never be stored.
server.servlet.session.cookie.secure=false
