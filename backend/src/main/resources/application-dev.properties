spring.flyway.locations=classpath:db/migration,classpath:db/devseed
spring.flyway.placeholders.seedPasswordHash=${SEED_PASSWORD_HASH:!SEED_ACCOUNT_LOCKED!}
app.auth.two-factor-enabled=false
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@example.test}

# Local development runs over plain HTTP, where a Secure cookie would never be stored.
server.servlet.session.cookie.secure=false
