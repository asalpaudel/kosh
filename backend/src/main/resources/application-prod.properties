# Production deliberately has no credential or localhost fallbacks. Missing values stop startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD}}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.auth.two-factor-enabled=true
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password-hash=${SUPERADMIN_PASSWORD_HASH:}
app.superadmin.otp-enabled=${SUPERADMIN_OTP_ENABLED:true}

server.servlet.session.cookie.secure=true
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NATIVE}
